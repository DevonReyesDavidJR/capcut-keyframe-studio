name: Publish visually reviewed preview
on:
  push:
    branches: [codex/refine-studio-ui-media]
    paths: [".github/workflows/publish-reviewed.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish-reviewed:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source and completed build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 76ccb56fde423b2db48dbb89b8c6107392c4ba7b
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41386173060" > run.json
          python -c 'import json,os; r=json.load(open("run.json")); assert r["conclusion"]=="success" and r["head_sha"]==os.environ["EXPECTED_SHA"]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41386173060
          path: release-assets
          merge-multiple: true
      - name: Prepare reviewed release notes
        shell: python
        run: |
          from pathlib import Path
          Path("notes.md").write_text("""Rounded native interface (Preview 4):
          - Rounded editor panels, project/folder selectors, tool tabs, buttons, monitor and timeline.
          - Antialiased surfaces, thin borders and consistent padding inspired by the Web interface.
          - Custom pill tabs replace native etched notebook tabs; selected states remain visible.
          - Existing motion controls, layer scrolling and GitHub updater are retained.

          On Preview 3, open Cap nhat > download > install and reopen to receive this version.
          Older installations can install the matching DMG manually.
          Desktop-Preview.png is a real macOS capture with synthetic sample assets.
          Native startup and existing updater/media/action checks passed on the build runners.
          FFmpeg remains a separate prerequisite. Preview macOS builds are not Developer-ID signed/notarized.
          """)
      - name: Keep the reviewed editor snapshots
        run: rm -f release-assets/Desktop-Update.png
      - name: Checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.exe *.zip *.png > SHA256SUMS.txt
      - name: Verify publisher changes do not change tested application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/76ccb56fde423b2db48dbb89b8c6107392c4ba7b...$GITHUB_SHA" > comparison.json
          python -c 'import json; assert all(f["filename"] == ".github/workflows/publish-reviewed.yml" for f in json.load(open("comparison.json"))["files"])'
      - name: Publish reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-preview.4 --repo "$GITHUB_REPOSITORY" --json targetCommitish > existing.json 2>/dev/null; then
            python -c 'import json,os; assert json.load(open("existing.json"))["targetCommitish"] == os.environ["GITHUB_SHA"]'
            echo "The reviewed build is already published."
          else
            gh release create v0.2.0-preview.4 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CapCut Keyframe Studio — rounded native interface" --notes-file notes.md --prerelease
          fi
