name: Build and publish preview apps
on:
  push:
    branches: [codex/refine-studio-ui-media]
    paths:
      - ".github/workflows/release.yml"
      - "release_tools/**"
      - "run.py"
      - "requirements*.txt"
      - "RELEASE_GUIDE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q core desktop_app.py desktop_update.py server.py run.py release_tools
      - run: node --check web/app.js
      - run: python -m release_tools.regression
      - run: python -m unittest release_tools.test_updater
      - run: python -m release_tools.smoke_web
      - run: python release_tools/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-edition
          path: dist/CapCut-Keyframe-Studio-Web.zip
          if-no-files-found: error

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt
      - run: python release_tools/build.py
      - name: Validate packaged desktop startup
        shell: python
        run: |
          import os
          import subprocess
          executable = (
              "dist/CapCut Keyframe Studio/CapCut Keyframe Studio.exe"
              if os.name == "nt" else
              "dist/CapCut Keyframe Studio.app/Contents/MacOS/CapCut Keyframe Studio"
          )
          subprocess.run([executable, "--self-test"], check=True, timeout=90)
      - name: Capture macOS native visual check
        if: matrix.artifact == 'macos-arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_tools.visual_check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.png
            dist/*.dmg
            dist/*-Setup.exe
          if-no-files-found: error

  publish:
    if: false
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0-preview.${{ github.run_number }}
        run: gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CapCut Keyframe Studio $RELEASE_TAG" --notes-file RELEASE_GUIDE.md --prerelease
